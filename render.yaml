databases:
  - name: turbine-turmweg-db
    databaseName: turbine_turmweg
    user: turbine
    plan: free

services:
  - type: web
    name: turbine-turmweg
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:push && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: turbine-turmweg-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BASE_URL
        sync: false
    healthCheckPath: /api/health
