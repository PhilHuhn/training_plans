databases:
  - name: turbine-turmweg-db
    databaseName: turbine_turmweg
    user: turbine
    plan: basic-256mb

services:
  - type: web
    name: turbine-turmweg
    runtime: node
    plan: starter
    # Build stays pure: install + compile. No schema changes here.
    buildCommand: npm ci && npm run build
    # Runs after a successful build, before traffic is switched over.
    # This is the correct lifecycle phase for schema pushes — a failed
    # push aborts the deploy instead of leaving a half-migrated DB live.
    preDeployCommand: npm run db:push
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: turbine-turmweg-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BASE_URL
        sync: false
      # Comma-separated operator emails; grants /admin without a DB write.
      - key: ADMIN_EMAILS
        sync: false
    healthCheckPath: /api/health
