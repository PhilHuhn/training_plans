# Postgres for local development. The Next.js app runs on the host via
# `npm run dev`, not inside docker.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: turbine
      POSTGRES_PASSWORD: turbine_dev
      POSTGRES_DB: turbine_turmweg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turbine -d turbine_turmweg"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
